server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Block dotfiles (except .well-known for ACME/SSL challenges)
    location ~ /\.(?!well-known) {
        return 444;
    }

    # Block common scanner probe paths
    location ~* ^/(error\.log|access\.log|debug\.log|wp-login\.php|wp-admin|xmlrpc\.php|phpinfo\.php|\.env\.bak|server-status|\.aws|\.docker) {
        return 444;
    }

    # WHY: Browsers/crawlers request /favicon.ico even though HTML specifies favicon.svg;
    # rewrite avoids 404 noise in logs
    location = /favicon.ico {
        rewrite ^ /favicon.svg last;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets with content-hashed names indefinitely
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
